name: Kubernetes and Cloud Run OTLP sidecars

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: catalog, images, patches, and collector configs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Validate candidate catalog and every rendered patch
        run: node --test tests/sidecar.test.mjs
      - name: Validate collector configuration with the pinned runtime
        run: >-
          docker run --rm
          --env ORES_OTEL_UPSTREAM_ENDPOINT=collector.observability.svc.cluster.local:4317
          --env ORES_OTEL_GITHUB_REPOSITORY=ores-otel/ores.otel.log
          --env POD_NAME=validation
          --env POD_NAMESPACE=validation
          --env NODE_NAME=validation
          --volume "$PWD/sidecar/k8s/base/collector.yaml:/etc/ores-otel/config.yaml:ro"
          otel/opentelemetry-collector-contrib:0.160.0@sha256:799dc6cf12c96192af37b5bdba804da8c10b3bc563b43cb90c3f3c58d9572ad6
          validate --config=/etc/ores-otel/config.yaml
      - name: Validate Cloud Run collector configuration
        run: >-
          docker run --rm
          --env ORES_OTEL_UPSTREAM_ENDPOINT=collector.example.test:4317
          --env ORES_OTEL_UPSTREAM_BEARER_TOKEN=ci-placeholder
          --env ORES_OTEL_UPSTREAM_INSECURE=false
          --volume "$PWD/sidecar/cloud-run/collector.yaml:/etc/ores-otel/config.yaml:ro"
          otel/opentelemetry-collector-contrib:0.160.0@sha256:799dc6cf12c96192af37b5bdba804da8c10b3bc563b43cb90c3f3c58d9572ad6
          validate --config=/etc/ores-otel/config.yaml
      - name: Check every sidecar entrypoint
        run: >-
          shellcheck
          sidecar/k8s/entrypoint.sh
          sidecar/cloud-run/native/entrypoint.sh
          sidecar/cloud-run/same-container/entrypoint.sh
          sidecar/cloud-run/same-container/app-required.sh
      - name: Build Kubernetes sidecar image
        run: docker build --file sidecar/k8s/Dockerfile --tag ores-otel/k8s-sidecar:test sidecar
      - name: Build native Cloud Run sidecar image
        run: docker build --file sidecar/cloud-run/native/Dockerfile --tag ores-otel/cloud-run-sidecar:test sidecar/cloud-run
      - name: Build same-container Cloud Run supervisor image
        run: docker build --file sidecar/cloud-run/same-container/Dockerfile --tag ores-otel/cloud-run-supervisor:test sidecar/cloud-run
