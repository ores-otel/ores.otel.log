name: Apply Ruby Fiber context hardening

on:
  push:
    branches:
      - hardening/ruby-fiber-context-20260911
    paths:
      - .github/workflows/apply-ruby-fiber-context-hardening.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact candidate identity
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Apply exact Fiber-local and deep-snapshot repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('sdk/ruby/lib/oresoftware/next_loggers.rb')
          text = path.read_text()
          old = '''    def current_context
              Thread.current.thread_variable_get(CONTEXT_KEY)
            end

            # Install context for the current thread and always restore the prior frame.
            def with_context(context)
              previous = current_context
              Thread.current.thread_variable_set(CONTEXT_KEY, normalize_context(context))
              yield
            ensure
              Thread.current.thread_variable_set(CONTEXT_KEY, previous)
            end
'''
          new = '''    def current_context
              # Thread#[] is Fiber-local in Ruby. That is the logical-request
              # boundary for schedulers that multiplex Fibers on one thread.
              Thread.current[CONTEXT_KEY]
            end

            # Install context for the current Fiber and always restore the prior frame.
            def with_context(context)
              previous = current_context
              Thread.current[CONTEXT_KEY] = normalize_context(context)
              yield
            ensure
              Thread.current[CONTEXT_KEY] = previous
            end

            # Context is immutable after normalization, so capture is O(1).
            def capture_context
              current_context
            end

            # Child threads/Fibers receive context only through explicit capture.
            def with_captured_context(context, &block)
              with_context(context, &block)
            end
'''
          if text.count(old) != 1:
              raise SystemExit('Ruby context storage fragment drifted')
          text = text.replace(old, new, 1)

          marker = '''    def normalize_context(context)
'''
          deep = '''    MAX_CONTEXT_SNAPSHOT_DEPTH = 128
            MAX_CONTEXT_SNAPSHOT_NODES = 10_000

            def deep_snapshot(value, seen = {}, depth = 0, budget = [0])
              raise ArgumentError, "context snapshot exceeds maximum depth" if depth > MAX_CONTEXT_SNAPSHOT_DEPTH

              case value
              when NilClass, TrueClass, FalseClass, Numeric, Symbol
                value
              when String, Time, Regexp
                value.dup.freeze
              when Hash
                known = seen[value.object_id]
                return known unless known.nil?
                budget[0] += 1
                raise ArgumentError, "context snapshot exceeds maximum node count" if budget[0] > MAX_CONTEXT_SNAPSHOT_NODES
                copy = {}
                seen[value.object_id] = copy
                value.each do |key, item|
                  copy[deep_snapshot(key, seen, depth + 1, budget)] =
                    deep_snapshot(item, seen, depth + 1, budget)
                end
                copy.freeze
              when Array
                known = seen[value.object_id]
                return known unless known.nil?
                budget[0] += 1
                raise ArgumentError, "context snapshot exceeds maximum node count" if budget[0] > MAX_CONTEXT_SNAPSHOT_NODES
                copy = []
                seen[value.object_id] = copy
                value.each { |item| copy << deep_snapshot(item, seen, depth + 1, budget) }
                copy.freeze
              else
                # Runtime-local objects are explicit opaque handles. Never call
                # serialization hooks or application getters while admitting context.
                value
              end
            end

'''
          if text.count(marker) != 1:
              raise SystemExit('Ruby normalize_context marker drifted')
          text = text.replace(marker, deep + marker, 1)

          old_init = '''        self.fields = (fields || {}).each_with_object({}) do |(key, value), out|
                  out[key.to_s] = value
                end.freeze
                self.tags = Array(tags).map(&:to_s).uniq.freeze
'''
          new_init = '''        normalized_fields = (fields || {}).each_with_object({}) do |(key, value), out|
                  out[key.to_s] = value
                end
                self.fields = NextLoggers.deep_snapshot(normalized_fields)
                self.tags = NextLoggers.deep_snapshot(Array(tags).map(&:to_s).uniq)
'''
          if text.count(old_init) != 1:
              raise SystemExit('Ruby Context initializer fragment drifted')
          text = text.replace(old_init, new_init, 1)
          path.write_text(text)
          PY

          cat > sdk/ruby/test/context_fiber_isolation_test.rb <<'RUBY'
          # frozen_string_literal: true

          require "minitest/autorun"
          require_relative "../lib/oresoftware/next_loggers"

          class ContextFiberIsolationTest < Minitest::Test
            NL = ORESoftware::NextLoggers

            def test_nested_values_are_owned_and_frozen
              source = {
                trace_id: "trace-a",
                fields: {
                  tenant: { id: "tenant-a", regions: ["west"] },
                  request: { id: "request-a", retry: { attempt: 1 } }
                },
                tags: ["request"]
              }

              NL.with_context(source) do
                source[:fields][:tenant][:id] = "attacker"
                source[:fields][:tenant][:regions] << "east"
                source[:fields][:request][:retry][:attempt] = 99
                source[:tags] << "attacker"

                context = NL.current_context
                assert_equal "tenant-a", context.fields.fetch("tenant").fetch(:id)
                assert_equal ["west"], context.fields.fetch("tenant").fetch(:regions)
                assert_equal 1, context.fields.fetch("request").fetch(:retry).fetch(:attempt)
                assert_equal ["request"], context.tags
                assert_raises(FrozenError) { context.fields.fetch("tenant")[:id] = "mutated" }
              end
              assert_nil NL.current_context
            end

            def test_same_thread_fibers_do_not_share_context
              first = Fiber.new do
                NL.with_context(trace_id: "fiber-a", fields: { tenant: { id: "a" } }) do
                  Fiber.yield [NL.current_context.trace_id, NL.current_context.fields.fetch("tenant").fetch(:id)]
                  Fiber.yield [NL.current_context.trace_id, NL.current_context.fields.fetch("tenant").fetch(:id)]
                end
                NL.current_context
              end
              second = Fiber.new do
                NL.with_context(trace_id: "fiber-b", fields: { tenant: { id: "b" } }) do
                  Fiber.yield [NL.current_context.trace_id, NL.current_context.fields.fetch("tenant").fetch(:id)]
                  Fiber.yield [NL.current_context.trace_id, NL.current_context.fields.fetch("tenant").fetch(:id)]
                end
                NL.current_context
              end

              assert_equal ["fiber-a", "a"], first.resume
              assert_equal ["fiber-b", "b"], second.resume
              assert_equal ["fiber-a", "a"], first.resume
              assert_equal ["fiber-b", "b"], second.resume
              assert_nil first.resume
              assert_nil second.resume
              assert_nil NL.current_context
            end

            def test_failure_restores_parent_fiber_frame
              NL.with_context(trace_id: "parent") do
                error = assert_raises(RuntimeError) do
                  NL.with_context(trace_id: "child") do
                    raise "expected"
                  end
                end
                assert_equal "expected", error.message
                assert_equal "parent", NL.current_context.trace_id
              end
              assert_nil NL.current_context
            end

            def test_child_thread_requires_explicit_capture
              NL.with_context(trace_id: "captured", fields: { tenant: { id: "tenant-c" } }) do
                captured = NL.capture_context
                observed = Queue.new
                Thread.new do
                  observed << NL.current_context
                  NL.with_captured_context(captured) do
                    observed << [NL.current_context.trace_id, NL.current_context.fields.fetch("tenant").fetch(:id)]
                  end
                  observed << NL.current_context
                end.join

                assert_nil observed.pop
                assert_equal ["captured", "tenant-c"], observed.pop
                assert_nil observed.pop
                assert_equal "captured", NL.current_context.trace_id
              end
              assert_nil NL.current_context
            end

            def test_cyclic_hash_is_snapshotted_without_pointing_to_caller
              cyclic = { id: "original" }
              cyclic[:self] = cyclic
              NL.with_context(fields: { cyclic: cyclic }) do
                cyclic[:id] = "attacker"
                observed = NL.current_context.fields.fetch("cyclic")
                assert_equal "original", observed.fetch(:id)
                assert_same observed, observed.fetch(:self)
              end
            end
          end
          RUBY
      - name: Run complete Ruby SDK syntax and tests
        shell: bash
        run: |
          set -euo pipefail
          ruby --version
          ruby -c sdk/ruby/lib/oresoftware/next_loggers.rb
          ruby sdk/ruby/test/next_loggers_test.rb
          ruby sdk/ruby/test/context_fiber_isolation_test.rb
          ruby sdk/ruby/test/shutdown_test.rb
      - name: Commit only validated Ruby product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sdk/ruby/lib/oresoftware/next_loggers.rb sdk/ruby/test/context_fiber_isolation_test.rb
          git diff --cached --check
          git commit -m "fix(ruby): isolate context by Fiber and own nested fields"
          git push origin "HEAD:${GITHUB_REF_NAME}"
