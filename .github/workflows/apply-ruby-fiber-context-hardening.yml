name: Apply Ruby Fiber context hardening

on:
  push:
    branches:
      - hardening/ruby-fiber-context-20260911
    paths:
      - .github/workflows/apply-ruby-fiber-context-hardening.yml
      - scripts/apply-ruby-fiber-context.py

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact candidate identity
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Apply reviewed transformation
        run: python3 scripts/apply-ruby-fiber-context.py
      - name: Run complete Ruby SDK syntax and tests
        run: |
          ruby --version
          ruby -c sdk/ruby/lib/oresoftware/next_loggers.rb
          ruby sdk/ruby/test/next_loggers_test.rb
          ruby sdk/ruby/test/context_fiber_isolation_test.rb
          ruby sdk/ruby/test/shutdown_test.rb
      - name: Commit only validated Ruby product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sdk/ruby/lib/oresoftware/next_loggers.rb sdk/ruby/test/context_fiber_isolation_test.rb
          git diff --cached --check
          git commit -m "fix(ruby): isolate context by Fiber and own nested fields"
          git push origin "HEAD:${GITHUB_REF_NAME}"
