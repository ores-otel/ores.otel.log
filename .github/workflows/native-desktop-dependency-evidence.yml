name: Native desktop dependency evidence

on:
  workflow_call:
    inputs:
      refresh-time-pin:
        type: boolean
        default: false
        description: Reconcile an existing time lock with the logger's reviewed exact version

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Reconcile the reviewed time dependency when requested
        if: inputs.refresh-time-pin
        run: cargo update -p time --precise 0.3.54
      - name: Resolve dependency graph with Cargo
        run: |
          cargo metadata --format-version 1 > "$RUNNER_TEMP/desktop-cargo-metadata.json"
          cargo metadata --locked --format-version 1 --no-deps > "$RUNNER_TEMP/desktop-locked-metadata.json"
          git rev-parse HEAD > "$RUNNER_TEMP/desktop-source-sha.txt"
      - name: Retain native lock and provenance for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desktop-dependency-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            Cargo.lock
            ${{ runner.temp }}/desktop-source-sha.txt
          if-no-files-found: error
          retention-days: 7
