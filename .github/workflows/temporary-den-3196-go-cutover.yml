name: Temporary DEN-3196 encrypted cutover push

on:
  push:
    branches:
      - agent/den-3196-canonical-go-cutover
    paths:
      - .github/workflows/temporary-den-3196-go-cutover.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: den-3196-encrypted-cutover-push
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'ores-otel/ores.otel.log' &&
      github.ref == 'refs/heads/agent/den-3196-canonical-go-cutover'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CONTROL_ISSUE: '9'
      CUTOVER_BRANCH: agent/den-3196-canonical-go-cutover
      CONFIRMATION: ores-otel/ores.otel.log-canonical-go-cutover
    steps:
      - name: Check out the exact feature branch without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/den-3196-canonical-go-cutover
          fetch-depth: 0
          persist-credentials: false

      - name: Receive one-run encrypted workflow-write credential
        id: handoff
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          work="$(mktemp -d)"
          private_key="$work/private.pem"
          public_key="$work/public.pem"
          token_file="$work/token.txt"
          matches="$work/matches.tsv"
          run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(openssl rand -hex 16)"

          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out "$private_key" >/dev/null 2>&1
          openssl pkey -in "$private_key" -pubout -out "$public_key" >/dev/null 2>&1
          key_b64="$(base64 -w0 < "$public_key")"
          key_comment_id="$(
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${CONTROL_ISSUE}/comments" \
              -f body="DEN3196_PAT_PUBLIC_KEY protocol=1 run_id=${run_id} key_b64=${key_b64} confirm=${CONFIRMATION}" \
              --jq .id
          )"

          prefix="DEN3196_PAT_CIPHERTEXT protocol=1 run_id=${run_id} data="
          ciphertext=''
          ciphertext_comment_id=''
          for _ in $(seq 1 600); do
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${CONTROL_ISSUE}/comments" \
              --jq ".[] | select(.user.login == \"ORESoftware\" and (.body | startswith(\"${prefix}\"))) | [.id,.body] | @tsv" \
              > "$matches"
            count="$(awk 'NF{n++} END{print n+0}' "$matches")"
            if [ "$count" -gt 1 ]; then
              echo '::error::Multiple ciphertext comments matched this one-run handoff.'
              exit 1
            fi
            if [ "$count" -eq 1 ]; then
              ciphertext_comment_id="$(cut -f1 "$matches")"
              body="$(cut -f2- "$matches")"
              ciphertext="${body#"$prefix"}"
              break
            fi
            sleep 3
          done
          test -n "$ciphertext" || { echo '::error::Encrypted credential was not supplied.'; exit 1; }

          printf '%s' "$ciphertext" | base64 -d > "$work/token.enc"
          openssl pkeyutl -decrypt \
            -inkey "$private_key" \
            -in "$work/token.enc" \
            -out "$token_file" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256

          user_token="$(tr -d '\r\n' < "$token_file")"
          case "$user_token" in
            ghp_*) ;;
            *) echo '::error::Decrypted payload is not a classic GitHub PAT.'; exit 1 ;;
          esac
          echo "::add-mask::$user_token"
          printf '%s' "$user_token" > "$token_file"
          chmod 600 "$token_file"
          rm -f "$work/token.enc" "$matches"

          {
            echo "run_id=$run_id"
            echo "work=$work"
            echo "token_file=$token_file"
            echo "key_comment_id=$key_comment_id"
            echo "ciphertext_comment_id=$ciphertext_comment_id"
          } >> "$GITHUB_OUTPUT"

      - name: Apply, validate, commit, and push the bounded cutover
        id: publish
        env:
          TOKEN_FILE: ${{ steps.handoff.outputs.token_file }}
        shell: bash
        run: |
          set -Eeuo pipefail
          user_token="$(cat "$TOKEN_FILE")"
          echo "::add-mask::$user_token"
          export GH_TOKEN="$user_token"

          test "$(gh api user --jq .login)" = ORESoftware
          gh auth setup-git >/dev/null

          python3 scripts/ops/apply_den_3196_cutover.py
          python3 -m pip install --disable-pip-version-check jsonschema==4.26.0 referencing==0.37.0 >/dev/null
          EXPECTED_REPOSITORY=ores-otel/ores.otel.log python3 scripts/validate-contracts.py
          (cd sdk/go && go test ./...)
          git diff --check

          git config user.name ORESoftware
          git config user.email alex@oresoftware.com
          git rm \
            .github/workflows/temporary-den-3196-go-cutover.yml \
            scripts/ops/apply_den_3196_cutover.py
          git add \
            sdk/go/go.mod \
            sdk/go/README.md \
            sdk/go/.zpkg-smoke.sh \
            .zpkg.toml \
            docs/CLI.md \
            docs/RELEASING.md \
            src/cli/package-catalog.ts \
            tests/zpkg.test.mjs \
            .github/workflows/release-native.yml \
            MIGRATION.md \
            scripts/validate-contracts.py

          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            .github/workflows/release-native.yml
            .github/workflows/temporary-den-3196-go-cutover.yml
            .zpkg.toml
            MIGRATION.md
            docs/CLI.md
            docs/RELEASING.md
            scripts/ops/apply_den_3196_cutover.py
            scripts/validate-contracts.py
            sdk/go/.zpkg-smoke.sh
            sdk/go/README.md
            sdk/go/go.mod
            src/cli/package-catalog.ts
            tests/zpkg.test.mjs
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${changed[*]}" = "${expected_sorted[*]}"

          git commit -m 'fix(DEN-3196): cut over canonical Go module metadata'
          git push origin "HEAD:${CUTOVER_BRANCH}"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish bounded receipt and destroy transient material
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.publish.outputs.head_sha }}
          JOB_STATUS: ${{ job.status }}
          WORK: ${{ steps.handoff.outputs.work }}
          KEY_COMMENT_ID: ${{ steps.handoff.outputs.key_comment_id }}
          CIPHERTEXT_COMMENT_ID: ${{ steps.handoff.outputs.ciphertext_comment_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$JOB_STATUS" = success ] && [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            body="DEN-3196 encrypted cutover push succeeded. Branch head: ${HEAD_SHA}. Run: ${run_url}. No force push, rebase, reset, release, package publication, or deployment was performed."
            state=closed
          else
            body="DEN-3196 encrypted cutover push failed closed. Job status: ${JOB_STATUS}. Run: ${run_url}. No successful branch-push receipt was produced."
            state=open
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${CONTROL_ISSUE}/comments" \
            -f body="$body" >/dev/null
          if [ -n "$CIPHERTEXT_COMMENT_ID" ]; then
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${CIPHERTEXT_COMMENT_ID}" >/dev/null || true
          fi
          if [ -n "$KEY_COMMENT_ID" ]; then
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${KEY_COMMENT_ID}" >/dev/null || true
          fi
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/${CONTROL_ISSUE}" \
            -f state="$state" >/dev/null
          if [ -d "$WORK" ]; then
            if command -v shred >/dev/null 2>&1; then
              find "$WORK" -type f -exec shred -u {} + 2>/dev/null || true
            fi
            rm -rf "$WORK"
          fi
          test "$JOB_STATUS" = success
