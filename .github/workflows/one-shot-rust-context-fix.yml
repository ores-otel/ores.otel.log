name: One-shot rust-context const initializer fix

on:
  push:
    branches: [feat/rust-workspace-consumer-20260810]
    paths:
      - .github/workflows/one-shot-rust-context-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/feat/rust-workspace-consumer-20260810'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/rust-workspace-consumer-20260810
          fetch-depth: 0
      - name: Apply the single reviewed Clippy fix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('sdk/rust-context/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          old = '    static THREAD_CONTEXT: RefCell<Vec<ThreadContextFrame>> = RefCell::new(Vec::new());'
          new = '    static THREAD_CONTEXT: RefCell<Vec<ThreadContextFrame>> = const { RefCell::new(Vec::new()) };'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one non-const THREAD_CONTEXT initializer')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          cargo fmt --all -- --check
          git diff --check
          git diff -- sdk/rust-context/src/lib.rs
      - name: Commit the reviewed source correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sdk/rust-context/src/lib.rs
          git commit -m 'Use a const thread-local context initializer'
          git push origin HEAD:feat/rust-workspace-consumer-20260810
