name: Erlang git_subdir parity

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: erlang-git-subdir-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exported Erlang package is byte-identical
        run: node scripts/check-erlang-git-subdir.mjs
