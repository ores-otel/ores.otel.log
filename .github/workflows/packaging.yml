name: Polyglot packaging

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-preflight:
    name: Zed and native package preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the immutable canonical interface dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ores-otel/ores-interfaces
          ref: 6b2e674464933a4de38785c03c33564661290454
          path: .zed/ci-deps/ores-interfaces
          persist-credentials: false

      - name: Check out immutable flags-2-env contract tooling
        uses: actions/checkout@v7
        with:
          repository: ORESoftware/flags-2-env
          ref: 611bba8f344cda4658de79c44d8954bef30cb6e5
          path: .flags2env
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
          cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19.0"
          gleam-version: "1.17.0"
          rebar3-version: "3.27.0"

      - name: Install audited just v1.51.0
        env:
          JUST_VERSION: 1.51.0
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/just.tar.gz" \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf "$RUNNER_TEMP/just.tar.gz" -C "$RUNNER_TEMP" just
          sudo install -m 0755 "$RUNNER_TEMP/just" /usr/local/bin/just
          just --version
      - name: Install audited ores-sops
        env:
          ORES_SOPS_REVISION: f152c11f76cc14b2af440b47c756b6c97c0aa36b
          ORES_SOPS_SHA256: be990d1d6e4df75b3e6bcc8f183018879554844db054997394bc0d31eed4c5ef
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/ores-sops" \
            "https://raw.githubusercontent.com/ORESoftware/ores-sops/${ORES_SOPS_REVISION}/ores-sops"
          printf '%s  %s\n' "$ORES_SOPS_SHA256" "$RUNNER_TEMP/ores-sops" | sha256sum --check --strict
          sudo install -m 0755 "$RUNNER_TEMP/ores-sops" /usr/local/bin/ores-sops
          ores-sops --version

      - name: Install real shell-completion runtimes
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes zsh

      - name: Audit the portable flags-2-env contract
        run: |
          make -C .flags2env cli
          .flags2env/build/flags2env audit .cli-flags.toml

      - name: Exercise canonical help and Bash/Zsh completion
        run: |
          python3 .flags2env/scripts/verify-shell-contract.py \
            --cli .flags2env/build/flags2env \
            --contract .cli-flags.toml \
            --command next-loggers \
            --install

      - name: Install JavaScript and Python packaging tools
        run: |
          npm ci
          python -m pip install --upgrade "setuptools>=77" build twine

      - name: Build and validate synchronized release metadata
        run: npm run release:check

      - name: Validate CLI, flags-2-env, and release-catalog documentation
        run: >-
          node --test
          tests/cli-flags.test.mjs
          tests/cli-packages.test.mjs
          tests/cli-packages-hardening.test.mjs

      - name: Install checksum-verified Zed CLI v0.3.0
        shell: bash
        env:
          ZED_VERSION: v0.3.0
          ZED_ARCHIVE_SHA256: f87576bc289e43ed647902527e7be70566445d2f1fd11249f067ab35547d4b8a
        run: |
          set -euo pipefail
          archive=zed-x86_64-unknown-linux-gnu.tar.gz
          base="https://github.com/zed-pkg/zed-cli/releases/download/${ZED_VERSION}"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/$archive" "$base/$archive"
          printf '%s  %s\n' "$ZED_ARCHIVE_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/zed" --version)" = 'zed 0.3.0'
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Inspect the deterministic Zed/native release plan
        run: zed release plan --json | tee zed-release-plan.json

      - name: Run Zed native-registry preflight adapters
        run: zed release preflight

      - name: Validate Gleam Hex package
        run: gleam export hex-tarball
        working-directory: sdk/gleam

      - name: Validate Erlang Hex package
        run: rebar3 hex build package
        working-directory: sdk/erlang

      - name: Validate Elixir Hex package
        run: |
          mix local.hex --force
          mix hex.build
        working-directory: sdk/elixir

      - name: Validate Ruby package and concurrency contract
        run: |
          ruby test/next_loggers_test.rb
          gem build --strict oresoftware-next-loggers.gemspec --output package.gem
        working-directory: sdk/ruby

      - name: Roundtrip the complete Zed artifact
        run: |
          set -euo pipefail
          registry="$RUNNER_TEMP/zed-dependency-registry"
          mkdir -p "$registry"
          (
            cd .zed/ci-deps/ores-interfaces
            zed \
              --registry "file://$registry" \
              --home "$RUNNER_TEMP/zed-seed-home" \
              publish --skip-vcs-checks
          )
          zed pack
          zed \
            --registry "file://$registry" \
            --home "$RUNNER_TEMP/zed-home" \
            r2g --r2g-root "$RUNNER_TEMP/zed-r2g" --clean
