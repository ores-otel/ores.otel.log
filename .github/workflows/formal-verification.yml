name: Formal verification

on:
  pull_request:
    paths:
      - 'formal/**'
      - 'contracts/schemas/shutdown-transition-vectors.schema.json'
      - 'scripts/check-formal-model.mjs'
      - 'scripts/stage-nodejs-release.mjs'
      - 'src/server-lifecycle.ts'
      - 'src/supabase-ingest.ts'
      - 'sdk/dart/**'
      - 'sdk/gleam/**'
      - 'sdk/go/**'
      - 'sdk/rust/**'
      - 'tests/formal-model.test.mjs'
      - 'tests/supabase-ingest.test.mjs'
      - 'package.json'
      - '.github/workflows/formal-verification.yml'
  push:
    branches: [main]
    paths:
      - 'formal/**'
      - 'contracts/schemas/shutdown-transition-vectors.schema.json'
      - 'scripts/check-formal-model.mjs'
      - 'scripts/stage-nodejs-release.mjs'
      - 'src/server-lifecycle.ts'
      - 'src/supabase-ingest.ts'
      - 'sdk/dart/**'
      - 'sdk/gleam/**'
      - 'sdk/go/**'
      - 'sdk/rust/**'
      - 'tests/formal-model.test.mjs'
      - 'tests/supabase-ingest.test.mjs'
      - 'package.json'
      - '.github/workflows/formal-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  language-refinement:
    name: TypeScript, Rust, Dart, Go, and Gleam refinement
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Set up Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: stable
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: sdk/go/go.mod
          cache: false
      - name: Set up Gleam and Erlang
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '28'
          gleam-version: '1.17.0'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Check executable finite-state models
        run: npm run test:formal
      - name: Check Rust formatting
        run: cargo +1.88.0 fmt --manifest-path sdk/rust/Cargo.toml -- --check
      - name: Check Rust shutdown refinement
        run: cargo +1.88.0 test --manifest-path sdk/rust/Cargo.toml --test shutdown_model --locked
      - name: Install Dart dependencies
        working-directory: sdk/dart
        run: dart pub get
      - name: Check Dart formal sources are formatted
        working-directory: sdk/dart
        run: dart format --output=none --set-exit-if-changed lib/shutdown.dart test/formal_shutdown_test.dart
      - name: Check Dart shutdown refinement
        working-directory: sdk/dart
        run: dart test test/formal_shutdown_test.dart
      - name: Check Go shutdown refinement
        working-directory: sdk/go
        run: go test -race -run 'TestGoShutdownRelation' ./...
      - name: Check Gleam formal sources are formatted
        working-directory: sdk/gleam
        run: gleam format --check src test
      - name: Check Gleam shutdown refinement
        working-directory: sdk/gleam
        run: gleam test

  tla:
    name: TLA+ safety and liveness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download and verify TLA+ tools 1.7.4
        run: |
          curl -fsSL --retry 3 --proto '=https' --tlsv1.2 \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
            -o /tmp/tla2tools-1.7.4.jar
          printf '%s  %s\n' \
            '936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88' \
            /tmp/tla2tools-1.7.4.jar | sha256sum -c -
      - name: Check shutdown lifecycle
        run: >-
          java -XX:+UseParallelGC -jar /tmp/tla2tools-1.7.4.jar
          -config formal/ShutdownLifecycle.cfg formal/ShutdownLifecycle.tla
      - name: Check bounded delivery lifecycle
        run: >-
          java -XX:+UseParallelGC -jar /tmp/tla2tools-1.7.4.jar
          -config formal/LogDelivery.cfg formal/LogDelivery.tla
