name: workflow provenance ratchet

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "tools/workflow-provenance/**"

permissions:
  contents: read

jobs:
  immutable-actions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0

      - name: Test structural YAML admission
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/workflow-provenance-target
        run: cargo test --locked --manifest-path tools/workflow-provenance/Cargo.toml

      - name: Verify touched workflow action refs are immutable
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/workflow-provenance-target
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          echo "tested_head=${actual_head}"
          test "${actual_head}" = "${HEAD_SHA}"
          git diff --name-only --diff-filter=ACMR -z "${BASE_SHA}" "${HEAD_SHA}" -- \
            '.github/workflows/*.yml' '.github/workflows/*.yaml' > "${RUNNER_TEMP}/workflow-paths"
          cargo run --quiet --locked --manifest-path tools/workflow-provenance/Cargo.toml < "${RUNNER_TEMP}/workflow-paths"
