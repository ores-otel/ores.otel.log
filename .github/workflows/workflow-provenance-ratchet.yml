name: workflow provenance ratchet

on:
  pull_request:
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  immutable-actions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify touched workflow action refs are immutable
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          echo "tested_head=${actual_head}"
          test "${actual_head}" = "${HEAD_SHA}"

          mapfile -t files < <(
            git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" -- \
              '.github/workflows/*.yml' '.github/workflows/*.yaml'
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "no touched workflow files found" >&2
            exit 2
          fi

          python3 - "${files[@]}" <<'PY'
          from pathlib import Path
          import re
          import sys

          action_sha = re.compile(r"^[^@\s]+@[0-9a-fA-F]{40}$")
          docker_digest = re.compile(r"^docker://[^@\s]+@sha256:[0-9a-fA-F]{64}$")
          uses_line = re.compile(r"^\s*(?:-\s*)?uses:\s*([^#\s]+)")

          def is_immutable(target: str) -> bool:
              if target.startswith("./"):
                  return True
              if target.startswith("docker://"):
                  return bool(docker_digest.fullmatch(target))
              return bool(action_sha.fullmatch(target))

          # Negative and positive fixtures keep the ratchet fail-closed.
          assert is_immutable(
              "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
          )
          assert not is_immutable("actions/checkout@v7")
          assert not is_immutable("docker://alpine:latest")
          assert is_immutable("docker://alpine@sha256:" + "a" * 64)

          failures: list[str] = []
          scanned = 0
          for raw in sys.argv[1:]:
              path = Path(raw)
              if not path.exists():
                  # Deleted workflows cannot introduce a mutable dependency.
                  continue
              scanned += 1
              for lineno, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  match = uses_line.match(line)
                  if not match:
                      continue
                  target = match.group(1)
                  if not is_immutable(target):
                      failures.append(
                          f"{raw}:{lineno}: mutable workflow dependency: {target}"
                      )

          if failures:
              print("\n".join(failures), file=sys.stderr)
              raise SystemExit(1)

          print(f"immutable workflow dependencies verified in {scanned} touched workflow(s)")
          PY
