name: validate Rust SDK serde_json interoperability

on:
  push:
    branches:
      - fix/rust-sdk-serde-json-interop-20260903

permissions:
  contents: write

jobs:
  lock-test-and-commit:
    if: ${{ !contains(github.event.head_commit.message, '[rust-sdk-lock-refreshed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt, clippy
      - name: Refresh root workspace lock
        run: cargo update -p serde_json --precise 1.0.151
      - name: Refresh standalone Rust SDK lock
        run: cargo update --manifest-path sdk/rust/Cargo.toml -p serde_json --precise 1.0.151
      - name: Format check
        run: cargo fmt --manifest-path sdk/rust/Cargo.toml -- --check
      - name: Standalone Rust SDK tests
        run: cargo test --manifest-path sdk/rust/Cargo.toml --locked
      - name: Rust workspace tests
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Diff integrity
        run: git diff --check
      - name: Commit refreshed lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock sdk/rust/Cargo.lock
          git commit -m "chore(rust): refresh serde_json lockfiles [rust-sdk-lock-refreshed]"
          git push origin HEAD:fix/rust-sdk-serde-json-interop-20260903
