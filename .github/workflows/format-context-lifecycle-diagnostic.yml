name: Build validated context lifecycle repair

on: push

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.mod

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Rust formatter and WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Install Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Gleam, Elixir, and Erlang
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '28'
          elixir-version: '1.19.0'
          gleam-version: '1.17.0'

      - name: Apply deterministic source repairs
        run: |
          set -euo pipefail
          python3 tools/build_context_lifecycle_repair.py
          gofmt -w \
            sdk/go/context_test.go \
            sdk/go/request_context.go \
            sdk/go/request_context_test.go
          cargo fmt --manifest-path sdk/rust-context/Cargo.toml
          cargo fmt --manifest-path sdk/rust-request-context/Cargo.toml
          # Run inside the package so the formatter picks up the pubspec language
          # version (>=3.3.0 => short style). From the repo root it would default to the
          # tall style and the in-package `dart format --set-exit-if-changed` check in
          # `npm run test:polyglot` would flip the same files straight back.
          (
            cd sdk/dart
            dart format \
              lib/next_loggers.dart \
              lib/shutdown.dart \
              test/context_shutdown.dart
          )
          (cd sdk/gleam && gleam format src test)

      - name: Validate Node request-context isolation
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test

      - name: Validate complete polyglot SDK matrix
        run: |
          set -euo pipefail
          npm run test:polyglot

      - name: Validate focused repaired runtimes
        run: |
          set -euo pipefail
          (cd sdk/go && go test ./...)
          cargo test --manifest-path sdk/rust-context/Cargo.toml
          cargo test --manifest-path sdk/rust-context/Cargo.toml --features tokio
          cargo test --manifest-path sdk/rust-request-context/Cargo.toml
          (
            cd sdk/dart
            dart pub get
            dart analyze
            dart run test/context_shutdown.dart
          )
          (
            cd sdk/gleam
            gleam format --check src test
            gleam test
          )
          git diff --check
          git diff --stat

      - name: Upload validated source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: context-lifecycle-repair
          if-no-files-found: error
          retention-days: 1
          path: |
            Cargo.lock
            Cargo.toml
            sdk/go/context_test.go
            sdk/go/request_context.go
            sdk/go/request_context_test.go
            sdk/rust-context/src/lib.rs
            sdk/rust-context/tests/context.rs
            sdk/rust-context/tests/tokio_context.rs
            sdk/rust-request-context/Cargo.toml
            sdk/rust-request-context/src/lib.rs
            sdk/rust-request-context/tests/request_context.rs
            sdk/dart/lib/next_loggers.dart
            sdk/dart/lib/shutdown.dart
            sdk/dart/test/context_shutdown.dart
            sdk/gleam/src/oresoftware_next_loggers_request_context.gleam
            sdk/gleam/test/request_context_test.gleam

      - name: Require committed generated and formatted sources
        run: git diff --exit-code
