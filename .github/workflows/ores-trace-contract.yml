# Static ORES trace-marker contract.
#
# Enforces the compatibility shape `^ores-(trace|routine)-[A-Za-z0-9_-]{12,64}$`
# across implementation call sites. New ORES-generated identifiers still use
# the canonical 21-character nanoid width; the checker self-tests that the
# canonical generator shape is a strict subset of the compatibility contract.
# This keeps CI aligned with the public wire/runtime contract instead of
# silently turning a generator convention into a breaking admission rule.
name: ORES trace marker contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ores-trace-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The checker is a single dependency-free Rust file, so it needs no
      # toolchain beyond the rustc already on the runner and never touches
      # this repo's own build or target directory.
      - name: Build the contract checker
        run: rustc -O -o "$RUNNER_TEMP/ores-trace-contract" .github/ores-trace-contract.rs

      - name: Self-test the contract checker
        run: |
          rustc --test -o "$RUNNER_TEMP/ores-trace-contract-test" .github/ores-trace-contract.rs
          "$RUNNER_TEMP/ores-trace-contract-test"

      - name: Verify static ORES trace markers
        run: |
          "$RUNNER_TEMP/ores-trace-contract" .
