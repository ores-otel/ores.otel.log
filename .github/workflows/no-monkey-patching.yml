name: no monkey patching E2E

on:
  pull_request:
    paths:
      - src/base-logger.ts
      - src/context.ts
      - src/context-shared.ts
      - src/node-logger.ts
      - src/otel.ts
      - tests/no-monkey-patching.e2e.test.mjs
      - package.json
      - package-lock.json
      - tsconfig.build.json
      - .github/workflows/no-monkey-patching.yml
  push:
    branches: [main]
    paths:
      - src/base-logger.ts
      - src/context.ts
      - src/context-shared.ts
      - src/node-logger.ts
      - src/otel.ts
      - tests/no-monkey-patching.e2e.test.mjs
      - package.json
      - package-lock.json
      - tsconfig.build.json
      - .github/workflows/no-monkey-patching.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - name: Install the locked dependency graph
        run: npm ci --ignore-scripts
      - name: Build the exact runtime exports
        run: npm run build
      - name: Run import, OTEL-send, and concurrent-context integrity journeys
        run: node --test tests/no-monkey-patching.e2e.test.mjs
