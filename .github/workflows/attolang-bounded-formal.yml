name: AttoLang bounded formal reference
on:
  pull_request:
    paths:
      - 'formal/attolang/**'
      - '.github/workflows/attolang-bounded-formal.yml'
  push:
    branches: [main]
    paths:
      - 'formal/attolang/**'
      - '.github/workflows/attolang-bounded-formal.yml'
permissions:
  contents: read
jobs:
  bounded-model:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert bounded safety and unsafe mutation rejection
        run: node formal/attolang/model-check.mjs
