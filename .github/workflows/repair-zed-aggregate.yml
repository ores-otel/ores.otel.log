name: Repair Zed aggregate contract

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-zed-aggregate.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Preserve target-owned installation and register the aggregate target
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest_path = Path('.zpkg.toml')
          manifest = manifest_path.read_text()
          root_install = '[install]\ndir = "zed_modules"\n\n'
          if root_install not in manifest:
              raise SystemExit('expected root install table was not found')
          manifest_path.write_text(manifest.replace(root_install, '', 1))

          test_path = Path('tests/zpkg.test.mjs')
          test = test_path.read_text()
          marker = 'const expectedTargets = {\n'
          aggregate = "  repository: { dir: '.', name: 'next-loggers', adapter: 'none' },\n"
          if aggregate not in test:
              if marker not in test:
                  raise SystemExit('expected target map was not found')
              test = test.replace(marker, marker + aggregate, 1)
          test_path.write_text(test)
          PY
      - name: Commit the synchronized package contract
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .zpkg.toml tests/zpkg.test.mjs
          git diff --cached --check
          git commit -m "test(zed): preserve target-owned aggregate installation"
          git push origin HEAD:main
