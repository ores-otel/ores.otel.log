name: Rust workspace consumer contract

on:
  pull_request:
    paths:
      - Cargo.toml
      - sdk/rust/**
      - sdk/rust-otel/**
      - sdk/wasm/**
      - .github/workflows/rust-workspace-consumer.yml
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - sdk/rust/**
      - sdk/rust-otel/**
      - sdk/wasm/**
      - .github/workflows/rust-workspace-consumer.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt,clippy
      - name: Verify workspace metadata
        run: cargo metadata --format-version 1 --no-deps > /tmp/metadata.json
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Test workspace
        run: cargo test --workspace --all-targets
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

  git-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Resolve the Rust logger from the exact repository head
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "${#SOURCE_SHA}" = 40
          mkdir -p "$RUNNER_TEMP/consumer/src"
          cat > "$RUNNER_TEMP/consumer/Cargo.toml" <<EOF
          [package]
          name = "ores-logger-git-consumer"
          version = "0.0.0"
          edition = "2021"

          [dependencies]
          next_loggers = { package = "oresoftware-next-loggers", git = "https://github.com/${SOURCE_REPOSITORY}.git", rev = "${SOURCE_SHA}" }
          EOF
          cat > "$RUNNER_TEMP/consumer/src/lib.rs" <<'EOF'
          #[cfg(test)]
          mod tests {
              use next_loggers::{Logger, Options, Value};

              #[test]
              fn resolves_and_emits_without_global_provider_mutation() {
                  let logger = Logger::new(Options {
                      app_name: "git-consumer".into(),
                      console: false,
                      ..Options::default()
                  });
                  let record = logger
                      .info(vec![Value::String("resolved".into())])
                      .send_with_store(false)
                      .expect("logger should emit")
                      .expect("INFO should pass the default level");
                  assert_eq!(record.app_name, "git-consumer");
                  assert_eq!(record.message, "resolved");
              }
          }
          EOF
          cargo test --manifest-path "$RUNNER_TEMP/consumer/Cargo.toml" --locked=false
