name: Dart format PR 25

on:
  push:
    branches:
      - fix/supabase-commit-ack-websocket-v1
    paths:
      - .github/workflows/dart-format-pr25.yml
      - sdk/dart/lib/supabase_websocket_ingest.dart
      - sdk/dart/test/supabase_websocket_ingest_test.dart
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dart-format-pr25-stable
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/supabase-commit-ack-websocket-v1
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Resolve package and format with package language settings
        shell: bash
        run: |
          set -euo pipefail
          cd sdk/dart
          dart pub get
          dart format lib/supabase_websocket_ingest.dart test/supabase_websocket_ingest_test.dart
      - name: Commit formatter-exact output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- sdk/dart/lib/supabase_websocket_ingest.dart sdk/dart/test/supabase_websocket_ingest_test.dart; then
            echo 'Dart files are already formatted for the resolved stable package.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sdk/dart/lib/supabase_websocket_ingest.dart sdk/dart/test/supabase_websocket_ingest_test.dart
          git commit -m 'style(dart): format resolved websocket ingest package'
          git push origin HEAD:fix/supabase-commit-ack-websocket-v1
