name: Dart format PR 25

on:
  push:
    branches:
      - fix/supabase-commit-ack-websocket-v1
    paths:
      - .github/workflows/dart-format-pr25.yml
      - sdk/dart/lib/supabase_websocket_ingest.dart
      - sdk/dart/test/supabase_websocket_ingest_test.dart
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dart-format-pr25
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/supabase-commit-ack-websocket-v1
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.3
      - name: Format the WebSocket ingest implementation and tests
        run: dart format sdk/dart/lib/supabase_websocket_ingest.dart sdk/dart/test/supabase_websocket_ingest_test.dart
      - name: Commit formatter-exact output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- sdk/dart/lib/supabase_websocket_ingest.dart sdk/dart/test/supabase_websocket_ingest_test.dart; then
            echo 'Dart files are already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sdk/dart/lib/supabase_websocket_ingest.dart sdk/dart/test/supabase_websocket_ingest_test.dart
          git commit -m 'style(dart): apply dart format to websocket ingest'
          git push origin HEAD:fix/supabase-commit-ack-websocket-v1
