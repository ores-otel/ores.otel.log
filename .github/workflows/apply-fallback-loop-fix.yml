name: Apply fallback loop fix

on:
  push:
    branches:
      - den-3432/supabase-realtime-batch
    paths:
      - .github/workflows/apply-fallback-loop-fix.yml

permissions:
  contents: write

concurrency:
  group: apply-fallback-loop-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: den-3432/supabase-realtime-batch
          fetch-depth: 0
      - name: Patch bounded fallback behavior
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 --decode > /tmp/apply-fallback-fix.py
          python3 /tmp/apply-fallback-fix.py
          rm .github/workflows/apply-fallback-loop-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(supabase): bound durable fallback failures'
          git push origin HEAD:den-3432/supabase-realtime-batch
