name: apply-require-send-wrapper-transfer

on:
  push:
    branches:
      - hardening/require-send-wrapper-transfer-20260911
    paths:
      - .github/workflows/apply-require-send-wrapper-transfer.yml
      - scripts/apply-require-send-wrapper-transfer.py
      - tests/ores-lint-require-send.test.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-require-send-wrapper-transfer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Verify exact candidate identity
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22.20.0
          cache: npm

      - name: Apply exact reviewed transformation twice
        run: |
          set -euo pipefail
          python3 scripts/apply-require-send-wrapper-transfer.py
          python3 scripts/apply-require-send-wrapper-transfer.py

      - name: Install, build, and typecheck
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck

      - name: Run focused scanner and CLI regressions
        run: |
          set -euo pipefail
          node --test tests/ores-lint-require-send.test.mjs tests/cli-lint.test.mjs
          output="$(ORES_LINT_REQUIRE_SEND_FILES=sdk/rust-web/src/server.rs node .ores-lint/require-send.mjs .)"
          printf '%s\n' "$output"
          grep -Fq 'ores-lint[require-send]: clean (1 file scanned)' <<<"$output"

      - name: Verify JavaScript hygiene repairs
        run: |
          set -euo pipefail
          npx eslint \
            tests/shutdown-runtime-coverage.test.mjs \
            tests/supabase-realtime-portability.test.mjs \
            tests/ores-lint-require-send.test.mjs

      - name: Run complete Node test suite
        run: npm test

      - name: Verify patch integrity
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- scripts/apply-require-send-wrapper-transfer.py
          test -z "$(git status --short --untracked-files=no | grep -vE '^( M|M |A | D|D ) (\.ores-lint/require-send\.mjs|tests/(shutdown-runtime-coverage|supabase-realtime-portability|ores-lint-require-send)\.test\.mjs)$' || true)"

      - name: Commit the tested product patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .ores-lint/require-send.mjs \
            tests/shutdown-runtime-coverage.test.mjs \
            tests/supabase-realtime-portability.test.mjs \
            tests/ores-lint-require-send.test.mjs
          if git diff --cached --quiet; then
            echo "No product changes remain to commit"
            exit 0
          fi
          git commit -m "fix(lint): recognize terminal wrapper event transfers"
          git push origin "HEAD:${GITHUB_REF_NAME}"
