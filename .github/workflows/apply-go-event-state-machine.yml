name: apply-go-event-state-machine

on:
  push:
    branches:
      - hardening/go-event-state-machine-20260911
    paths:
      - .github/workflows/apply-go-event-state-machine.yml
      - scripts/apply-go-event-state-machine.py
      - sdk/go/event_state_test.go
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-go-event-state-machine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Verify exact candidate identity
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.24.7
          cache: false

      - name: Apply exact reviewed source transformation twice
        run: |
          set -euo pipefail
          python3 scripts/apply-go-event-state-machine.py
          python3 scripts/apply-go-event-state-machine.py

      - name: Format and verify Go sources
        run: |
          set -euo pipefail
          gofmt -w sdk/go/logger.go sdk/go/event_state_test.go
          test -z "$(gofmt -d sdk/go)"

      - name: Vet and repeatedly race-test the complete Go SDK
        working-directory: sdk/go
        run: |
          set -euo pipefail
          go vet ./...
          go test -race -shuffle=on -count=5 ./...

      - name: Verify patch integrity
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- scripts/apply-go-event-state-machine.py
          test -z "$(git status --short --untracked-files=no | grep -vE '^( M|M |A | D|D ) sdk/go/(logger.go|event_state_test.go)$' || true)"

      - name: Commit the tested product patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sdk/go/logger.go sdk/go/event_state_test.go
          if git diff --cached --quiet; then
            echo "No product changes remain to commit"
            exit 0
          fi
          git commit -m "fix(go): serialize event builders and logger snapshots"
          git push origin "HEAD:${GITHUB_REF_NAME}"
