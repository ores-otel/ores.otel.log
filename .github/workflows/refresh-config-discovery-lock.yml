name: refresh-config-discovery-lock

on:
  push:
    branches:
      - harden/repin-config-discovery-1ffd946-20260919

permissions:
  contents: write

jobs:
  regenerate-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          show-progress: false
      - name: Install workspace Rust floor
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0
      - name: Regenerate only the discovery lock entry with Cargo
        run: cargo update -p ores-config-discovery
      - name: Commit Cargo-generated lockfile when changed
        run: |
          set -euo pipefail
          git diff -- Cargo.lock
          if git diff --quiet -- Cargo.lock; then
            echo 'Cargo.lock already matches the manifest pin.'
            exit 0
          fi
          test "$(git diff --name-only | tr -d '\n')" = 'Cargo.lock'
          git config user.name 'ORESoftware CI'
          git config user.email 'noreply@oresoftware.com'
          git add Cargo.lock
          git commit -m 'chore(config): regenerate workspace lock for discovery repin'
          git push origin HEAD:harden/repin-config-discovery-1ffd946-20260919
