name: Refresh Rust web generated files
# Narrow maintenance for this explicitly authorized feature branch. Never runs
# on main, forks, pull_request_target, or arbitrary user-supplied branches.
on:
  push:
    branches: ['DEN-3432-rust-wasm-web-bridge']
    paths: ['.github/workflows/refresh-rust-web-generated.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-web-generated-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'ores-otel/ores.otel.log' && github.ref == 'refs/heads/DEN-3432-rust-wasm-web-bridge'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: DEN-3432-rust-wasm-web-bridge
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt
      - name: Generate from authoritative manifests and format only this package
        run: |
          cargo generate-lockfile
          cargo fmt -p ores-otel-web
      - name: Publish a bounded, non-force feature-branch commit
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Cargo.lock sdk/rust-web/src/lib.rs sdk/rust-web/src/browser.rs sdk/rust-web/src/server.rs sdk/rust-web/tests/browser.rs
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --stat
          git commit -m 'DEN-3432: apply Cargo-generated lock and rustfmt output'
          git push origin HEAD:refs/heads/DEN-3432-rust-wasm-web-bridge
# The generated commit does not imply acceptance. The caller must trigger/recheck
# all required CI on the resulting head and review the diff before any merge.
