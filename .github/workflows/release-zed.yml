name: Release Zed packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: zed-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish every language slice to Zed
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    environment: zed-pkg
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build
      - run: node scripts/verify-release-tag.mjs zed
      - name: Install the pinned Zed CLI
        run: >-
          cargo install
          --git https://github.com/zed-pkg/zed-cli
          --rev 5cef340b85b91f77c8b8644ac66e3534f58f85b6
          --locked zed-cli
      - run: zed release plan
      - run: zed pack
      - run: zed r2g --clean
      - run: zed publish
        env:
          ZED_PKG_TOKEN: ${{ secrets.ZED_PKG_TOKEN }}

  sidecar-images:
    name: Publish Ores OTEL sidecar images
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Verify the immutable package-family tag
        run: node scripts/verify-release-tag.mjs zed
      - name: Authenticate to GitHub Container Registry
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create an isolated BuildKit builder
        run: docker buildx create --driver docker-container --name ores-otel-sidecars --use
      - name: Publish Kubernetes sidecar
        run: >-
          docker buildx build
          --file sidecar/k8s/Dockerfile
          --platform linux/amd64
          --provenance=true
          --sbom=true
          --tag "ghcr.io/ores-otel/otel-k8s-sidecar:${GITHUB_REF_NAME#v}"
          --tag "ghcr.io/ores-otel/otel-k8s-sidecar:sha-${GITHUB_SHA}"
          --push
          sidecar
      - name: Publish native Cloud Run sidecar
        run: >-
          docker buildx build
          --file sidecar/cloud-run/native/Dockerfile
          --platform linux/amd64
          --provenance=true
          --sbom=true
          --tag "ghcr.io/ores-otel/otel-cloud-run-sidecar:${GITHUB_REF_NAME#v}"
          --tag "ghcr.io/ores-otel/otel-cloud-run-sidecar:sha-${GITHUB_SHA}"
          --push
          sidecar/cloud-run
      - name: Publish same-container Cloud Run supervisor
        run: >-
          docker buildx build
          --file sidecar/cloud-run/same-container/Dockerfile
          --platform linux/amd64
          --provenance=true
          --sbom=true
          --tag "ghcr.io/ores-otel/otel-cloud-run-supervisor:${GITHUB_REF_NAME#v}"
          --tag "ghcr.io/ores-otel/otel-cloud-run-supervisor:sha-${GITHUB_SHA}"
          --push
          sidecar/cloud-run
