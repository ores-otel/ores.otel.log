name: Gleam 1.17 branch formatter

on:
  push:
    branches:
      - agent/dart-gleam-source-hardening-v2
    paths:
      - sdk/gleam/**
      - .github/workflows/gleam-117-format-branch.yml

permissions:
  contents: write

concurrency:
  group: gleam-117-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          gleam-version: '1.17.0'

      - name: Format with the CI-pinned Gleam toolchain
        shell: bash
        run: |
          set -euo pipefail
          cd sdk/gleam
          gleam format src test
          gleam test

      - name: Commit formatter output to this branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- sdk/gleam; then
            echo 'Gleam source is already formatted for 1.17.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sdk/gleam
          git commit -m 'style: format Gleam with 1.17'
          git push origin HEAD:agent/dart-gleam-source-hardening-v2
