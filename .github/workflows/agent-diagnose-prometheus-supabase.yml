name: Diagnose telemetry test failure

on:
  push:
    branches:
      - agent/prometheus-supabase-hardening
    paths:
      - '.github/workflows/agent-diagnose-prometheus-supabase.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Run tests and expose bounded failure output
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          set +e
          npm test > "$RUNNER_TEMP/npm-test.log" 2>&1
          status=$?
          set -e
          tail -n 240 "$RUNNER_TEMP/npm-test.log"
          if (( status != 0 )); then
            while IFS= read -r line; do
              [[ -z "$line" ]] || printf '::error::%s\n' "$line"
            done < <(tail -n 120 "$RUNNER_TEMP/npm-test.log")
          fi
          exit "$status"
