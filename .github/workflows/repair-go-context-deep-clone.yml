name: Repair Go recursive context ownership

on:
  push:
    branches:
      - hardening/async-context-fiber-snapshots-20260911
    paths:
      - .github/workflows/repair-go-context-deep-clone.yml

permissions:
  contents: write

jobs:
  repair-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact input identity
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.24.7"
          cache: false
      - name: Add bounded graph-aware context cloning
        shell: bash
        run: |
          set -euo pipefail
          cat > sdk/go/context_clone.go <<'GO'
          package nextloggers

          import "reflect"

          const (
            maxContextCloneDepth = 128
            maxContextCloneNodes = 10000
          )

          type contextCloneVisit struct {
            typ      reflect.Type
            kind     reflect.Kind
            pointer  uintptr
            length   int
            capacity int
          }

          type contextCloneState struct {
            seen  map[contextCloneVisit]reflect.Value
            nodes int
          }

          func cloneContextAny(value any) any {
            if value == nil {
              return nil
            }
            state := &contextCloneState{seen: make(map[contextCloneVisit]reflect.Value)}
            cloned := cloneContextReflect(reflect.ValueOf(value), state, 0)
            if !cloned.IsValid() {
              return nil
            }
            return cloned.Interface()
          }

          func cloneContextReflect(value reflect.Value, state *contextCloneState, depth int) reflect.Value {
            if !value.IsValid() {
              return value
            }
            if depth > maxContextCloneDepth {
              panic("nextloggers: context snapshot exceeds maximum depth")
            }

            switch value.Kind() {
            case reflect.Interface:
              if value.IsNil() {
                return reflect.Zero(value.Type())
              }
              cloned := cloneContextReflect(value.Elem(), state, depth+1)
              result := reflect.New(value.Type()).Elem()
              result.Set(cloned)
              return result
            case reflect.Map:
              if value.IsNil() {
                return reflect.Zero(value.Type())
              }
              visit := contextCloneVisit{
                typ: value.Type(), kind: value.Kind(), pointer: value.Pointer(),
              }
              if known, ok := state.seen[visit]; ok {
                return known
              }
              state.nodes++
              if state.nodes > maxContextCloneNodes {
                panic("nextloggers: context snapshot exceeds maximum node count")
              }
              result := reflect.MakeMapWithSize(value.Type(), value.Len())
              state.seen[visit] = result
              iterator := value.MapRange()
              for iterator.Next() {
                result.SetMapIndex(
                  iterator.Key(),
                  cloneContextReflect(iterator.Value(), state, depth+1),
                )
              }
              return result
            case reflect.Slice:
              if value.IsNil() {
                return reflect.Zero(value.Type())
              }
              visit := contextCloneVisit{
                typ: value.Type(), kind: value.Kind(), pointer: value.Pointer(),
                length: value.Len(), capacity: value.Cap(),
              }
              if visit.pointer != 0 {
                if known, ok := state.seen[visit]; ok {
                  return known
                }
              }
              state.nodes++
              if state.nodes > maxContextCloneNodes {
                panic("nextloggers: context snapshot exceeds maximum node count")
              }
              result := reflect.MakeSlice(value.Type(), value.Len(), value.Len())
              if visit.pointer != 0 {
                state.seen[visit] = result
              }
              for index := 0; index < value.Len(); index++ {
                result.Index(index).Set(cloneContextReflect(value.Index(index), state, depth+1))
              }
              return result
            case reflect.Array:
              result := reflect.New(value.Type()).Elem()
              for index := 0; index < value.Len(); index++ {
                result.Index(index).Set(cloneContextReflect(value.Index(index), state, depth+1))
              }
              return result
            default:
              // Scalars are immutable. Structs, pointers, functions, channels,
              // and other host objects are runtime-local opaque handles.
              return value
            }
          }

          func cloneContextMap(source map[string]any) map[string]any {
            if source == nil {
              return map[string]any{}
            }
            return cloneContextAny(source).(map[string]any)
          }

          func cloneContextSlice(source []any) []any {
            if source == nil {
              return nil
            }
            return cloneContextAny(source).([]any)
          }
          GO

          python3 - <<'PY'
          from pathlib import Path

          path = Path("sdk/go/context.go")
          text = path.read_text()
          replacements = [
              ("target = append(target, cloneMap(value))", "target = append(target, cloneContextMap(value))"),
              ("value.LoggedInUser = cloneMap(value.LoggedInUser)", "value.LoggedInUser = cloneContextMap(value.LoggedInUser)"),
              ("value.Fields = cloneMap(value.Fields)", "value.Fields = cloneContextMap(value.Fields)"),
              ("value.Context = append([]any(nil), value.Context...)", "value.Context = cloneContextSlice(value.Context)"),
              ("value.Meta = append([]any(nil), value.Meta...)", "value.Meta = cloneContextSlice(value.Meta)"),
              ("merged := cloneLogContext(base)\n", "merged := cloneLogContext(base)\n\tpatch = cloneLogContext(patch)\n"),
              ("merged.Users = append(merged.Users, cloneMap(user))", "merged.Users = append(merged.Users, cloneContextMap(user))"),
              ("return cloneMap(value.LoggedInUser), true", "return cloneContextMap(value.LoggedInUser), true"),
              ("fields := cloneMap(value.Fields)", "fields := cloneContextMap(value.Fields)"),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one Go integration fragment, found {count}: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Format and run the race-enabled Go suite
        working-directory: sdk/go
        run: |
          gofmt -w context.go context_clone.go context_deep_snapshot_test.go
          test -z "$(gofmt -l .)"
          go test -race ./...
      - name: Commit only the validated Go product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sdk/go/context.go sdk/go/context_clone.go sdk/go/context_deep_snapshot_test.go
          git diff --cached --check
          git commit -m "fix(go): recursively own request context values"
          git push origin "HEAD:${GITHUB_REF_NAME}"
