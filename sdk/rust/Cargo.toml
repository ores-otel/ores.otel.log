[package]
name = "oresoftware-next-loggers"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Rust implementation of the next-loggers/v1 structured logging contract"
license = "MIT"
repository = "https://github.com/ores-otel/ores.otel.log"
homepage = "https://github.com/ores-otel/ores.otel.log"
documentation = "https://docs.rs/oresoftware-next-loggers"
readme = "README.md"
keywords = ["logging", "opentelemetry", "observability", "supabase"]
categories = ["development-tools::debugging"]
include = ["src/**", "tests/**", "README.md", "LICENSE"]

[lib]
name = "next_loggers"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# 1.0.151 pulls `zmij`, whose current release requires rustc 1.71.
# Keep the exact audited graph deterministic for supported consumers.
serde_json = "=1.0.145"
# Exact-pin the audited release so fresh consumers cannot resolve a vulnerable
# 0.3.x version while the supported resolver/toolchain remains deterministic.
time = { version = "=0.3.54", features = ["formatting"] }
