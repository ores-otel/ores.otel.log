[package]
name = "oresoftware-next-loggers"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Rust implementation of the next-loggers/v1 structured logging contract"
license = "MIT"
repository = "https://github.com/ores-otel/ores.otel.log"
homepage = "https://github.com/ores-otel/ores.otel.log"
documentation = "https://docs.rs/oresoftware-next-loggers"
readme = "README.md"
keywords = ["logging", "opentelemetry", "observability", "supabase"]
categories = ["development-tools::debugging"]
include = ["src/**", "tests/**", "README.md", "LICENSE"]

[lib]
name = "next_loggers"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Keep the 0.3 line consumer-compatible. Exact pinning here conflicts with
# applications whose transitive graph requires a newer compatible time release;
# the committed Cargo.lock still supplies the standalone/MSRV-tested resolution.
time = { version = "0.3", features = ["formatting"] }
