[package]
name = "oresoftware-telemetry-ticket"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Mint and verify one-time HMAC tickets for the ores-otel/ws-ingest/v1 Supabase WebSocket telemetry protocol; optional axum route."
repository = "https://github.com/ores-otel/ores.otel.log"

# Standalone crate inside the ores.otel.log repo (whose root Cargo.toml is a workspace that does not list it).
[workspace]

[features]
default = []
axum = ["dep:axum"]

[dependencies]
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
subtle = "2"
axum = { version = "0.8", optional = true, default-features = false, features = ["json"] }
