extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 96
    spike_limit_mib: 24
  resource/pod:
    attributes:
      - key: k8s.pod.name
        value: ${env:POD_NAME}
        action: insert
      - key: k8s.namespace.name
        value: ${env:POD_NAMESPACE}
        action: insert
      - key: k8s.node.name
        value: ${env:NODE_NAME}
        action: insert
      - key: github.repository
        value: ${env:ORES_OTEL_GITHUB_REPOSITORY}
        action: insert
  attributes/security:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete
      - key: db.statement
        action: delete
      - key: url.query
        action: delete
      - key: enduser.id
        action: delete
  batch:
    timeout: 1s
    send_batch_size: 512
    send_batch_max_size: 1024

exporters:
  otlp_grpc/upstream:
    endpoint: ${env:ORES_OTEL_UPSTREAM_ENDPOINT}
    tls:
      insecure: true
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 2048
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m

service:
  extensions:
    - health_check
  telemetry:
    logs:
      level: info
      encoding: json
  pipelines:
    logs:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - resource/pod
        - attributes/security
        - batch
      exporters:
        - otlp_grpc/upstream
    metrics:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - resource/pod
        - batch
      exporters:
        - otlp_grpc/upstream
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - resource/pod
        - attributes/security
        - batch
      exporters:
        - otlp_grpc/upstream
