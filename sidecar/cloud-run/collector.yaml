extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 96
    spike_limit_mib: 24
  resourcedetection/gcp:
    detectors:
      - gcp
    override: false
    timeout: 2s
  resource/ores:
    attributes:
      - key: service.namespace
        value: ores-otel
        action: insert
      - key: ores.telemetry.source
        value: https://github.com/ores-otel
        action: upsert
      - key: ores.telemetry.transport
        value: cloud-run-sidecar
        action: upsert
  attributes/security:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete
      - key: db.statement
        action: delete
      - key: url.query
        action: delete
      - key: enduser.id
        action: delete
  batch:
    timeout: 1s
    send_batch_size: 512
    send_batch_max_size: 1024

exporters:
  otlp_grpc/upstream:
    endpoint: ${env:ORES_OTEL_UPSTREAM_ENDPOINT}
    headers:
      authorization: Bearer ${env:ORES_OTEL_UPSTREAM_BEARER_TOKEN}
    tls:
      insecure: ${env:ORES_OTEL_UPSTREAM_INSECURE}
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 2048
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m

service:
  extensions:
    - health_check
  telemetry:
    resource:
      service.name: ores-otel-sidecar
      service.namespace: ores-otel
      ores.telemetry.source: https://github.com/ores-otel
    logs:
      level: info
      encoding: json
  pipelines:
    logs:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - resourcedetection/gcp
        - resource/ores
        - attributes/security
        - batch
      exporters:
        - otlp_grpc/upstream
    metrics:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - resourcedetection/gcp
        - resource/ores
        - batch
      exporters:
        - otlp_grpc/upstream
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - resourcedetection/gcp
        - resource/ores
        - attributes/security
        - batch
      exporters:
        - otlp_grpc/upstream
