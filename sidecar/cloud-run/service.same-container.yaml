apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: APP_SERVICE_NAME
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containers:
        - name: app
          image: SUPERVISED_APP_IMAGE_AT_DIGEST
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: ORES_OTEL_UPSTREAM_ENDPOINT
              value: OTLP_GATEWAY_HOST_AND_PORT
            - name: ORES_OTEL_UPSTREAM_INSECURE
              value: "false"
            - name: ORES_OTEL_UPSTREAM_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ores-otel-upstream-token
                  key: latest
            - name: GOMEMLIMIT
              value: 100MiB
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            failureThreshold: 30
            periodSeconds: 1
            timeoutSeconds: 1
          resources:
            limits:
              cpu: 1
              memory: 512Mi
