auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

ingester:
  chunk_encoding: snappy

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 168h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_query_lookback: 168h
  otlp_config:
    resource_attributes:
      ignore_defaults: true
      attributes_config:
        # Intentionally low-cardinality. Instance IDs, pod names, trace IDs,
        # span IDs, and user IDs remain structured metadata, not stream labels.
        - action: index_label
          attributes:
            - service.name
            - service.namespace
            - deployment.environment.name
        - action: structured_metadata
          attributes:
            - service.version
            - telemetry.sdk.language
            - telemetry.sdk.name
            - telemetry.sdk.version

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

query_range:
  align_queries_with_step: true
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

analytics:
  reporting_enabled: false
