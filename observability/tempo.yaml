stream_over_http_enabled: true

server:
  http_listen_port: 3200
  grpc_listen_port: 9095
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  trace_idle_period: 5s
  max_block_duration: 30s

compactor:
  compaction:
    block_retention: 168h

metrics_generator:
  registry:
    collection_interval: 5s
    external_labels:
      source: tempo
      cluster: next-loggers-local
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  processor:
    service_graphs:
      wait: 10s
      max_items: 10000
    span_metrics:
      intrinsic_dimensions:
        service: true
        span_name: true
        span_kind: false
        status_code: true
        status_message: false
      enable_target_info: false
      dimensions:
        - deployment.environment.name

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

query_frontend:
  search:
    duration_slo: 5s
    throughput_bytes_slo: 1073741824

usage_report:
  reporting_enabled: false

overrides:
  defaults:
    metrics_generator:
      processors: [span-metrics, service-graphs]
      max_active_series: 100000
